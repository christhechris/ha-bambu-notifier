name: Bambu Notifier
version: "1.0.0"
slug: bambu_notifier
description: Discord/Slack/Telegram notifications for Bambu Lab printers via their local MQTT
url: https://github.com/christhechris/ha-bambu-notifier
arch:
  - aarch64
  - amd64
  - armv7
image: ghcr.io/christhechris/{arch}-bambu-notifier-addon
startup: application
boot: auto
options:
  log:
    level: info
    format: text
  tail: false
  printer: []
schema:
  log:
    level: list(debug|info|warn|error)?
    format: list(json|text)?
  tail: bool?
  printer:
    - name: str
      host: str
      port: int?
      serial_number: str
      access_code: password
      camera_port: int?
      tls_insecure_skip_verify: bool?
      reconnect_delay_seconds: int?
      discord:
        - name: str?
          webhook_url: str
          secret: password?
      slack:
        - name: str?
          webhook_url: str
          secret: password?
      telegram:
        - name: str?
          bot_token: password
          chat_id: str
