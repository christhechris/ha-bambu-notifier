version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      excludes:
        - G117  # config structs holding secrets are not hardcoded secrets
        - G304  # reading config file from a path variable is expected
    revive:
      rules:
        - name: blank-imports
        - name: unused-parameter
        - name: unreachable-code
  exclusions:
    presets: []
    rules:
      - path: _test\.go
        linters:
          - gosec
